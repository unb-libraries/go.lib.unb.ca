dockworker:
  version: '6'
  application:
    name: UNB Link Shortener
    uri: https://go.lib.unb.ca
    description: >
      UNB Link Shortener.
    topics:
     - links
    identifiers:
      id: go.lib.unb.ca
      slug: go-lib-unb-ca
      short_slug: golib
      uuid: 3100
    framework:
      name: nginx
      version: 1
      startup_finished_marker: 99_z_notify_user_URI
      endpoint:
        name: http
        port: 80
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - prod
    deployments:
      go-lib-unb-ca:
        default: true
        managed: true
        name: go-lib-unb-ca
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: go.lib.unb.ca
    jira:
      project_keys:
        - LIB
    image:
      name: ghcr.io/unb-libraries/go.lib.unb.ca
      parent: ghcr.io/unb-libraries/nginx:2.x
      repository: GitHub
      push-branches:
        - prod
